apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasksphere-ingress
  namespace: tasksphere
spec:
  ingressClassName: nginx
  rules:
    - host: tasksphere.43.204.2.109.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasksphere-service
                port:
                  number: 80
