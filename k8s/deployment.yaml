apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasksphere
  namespace: tasksphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasksphere
  template:
    metadata:
      labels:
        app: tasksphere
    spec:
      containers:
        - name: tasksphere
          image: vidhijain15/tasksphere:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: TASKSPHERE_DB
              value: /data/tasksphere.db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: database-storage
              mountPath: /data
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: tasksphere-pvc
