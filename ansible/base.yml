---
- name: Configure TaskSphere base server
  hosts: tasksphere
  become: true
  gather_facts: true

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apparmor
          - software-properties-common
        state: present

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Enable Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add Ubuntu user to Docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install k3s without Traefik
      shell: curl -sfL https://get.k3s.io | sh -s - server --disable traefik
      args:
        creates: /usr/local/bin/k3s

    - name: Enable k3s
      systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for Kubernetes API
      command: kubectl get nodes
      register: k3s_status
      retries: 20
      delay: 10
      until: k3s_status.rc == 0
      changed_when: false

    - name: Create 2 GB swap file
      command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Set swap permissions
      file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Format swap file
      command: mkswap /swapfile
      when: ansible_swaptotal_mb | int == 0

    - name: Enable swap
      command: swapon /swapfile
      when: ansible_swaptotal_mb | int == 0

    - name: Persist swap configuration
      mount:
        name: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    - name: Install CloudWatch Agent
      apt:
        deb: https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
        state: present
